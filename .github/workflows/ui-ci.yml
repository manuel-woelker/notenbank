name: UI CI

on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'

jobs:
  ui-checks:
    name: UI Build, Test, Lint & Format Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck
        continue-on-error: false

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Format check
        run: pnpm format:check
        continue-on-error: false

      - name: Run tests with coverage
        run: pnpm test --coverage --reporter=verbose --reporter=json --outputFile=test-results.json
        continue-on-error: false

      - name: Build
        run: pnpm build
        continue-on-error: false

      # Upload test results as artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ui/test-results.json
          retention-days: 30

      # Upload coverage report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ui/coverage/
          retention-days: 30

      # Generate test summary
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results.json ]; then
            echo "✅ Tests completed. See artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Test results file not found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -d coverage ]; then
            echo "📊 Coverage report available in artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not generated." >> $GITHUB_STEP_SUMMARY
          fi
