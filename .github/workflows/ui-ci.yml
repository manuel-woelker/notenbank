name: UI CI

on:
  push:
    branches: [master]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-ci.yml'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  ui-checks:
    name: UI Build, Test, Lint & Format Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck
        continue-on-error: false

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Format check
        run: pnpm format:check
        continue-on-error: false

      - name: Generate git info
        run: node scripts/generate-git-info.js

      - name: Run tests with coverage
        run: pnpm test:ci
        continue-on-error: false

      - name: Build
        run: pnpm build
        continue-on-error: false

      # Upload test results as artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ui/test-results.xml
          retention-days: 30

      # Upload coverage report
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ui/coverage/
          retention-days: 30

      - name: Test Report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Vitest Tests
          path: ui/test-results.xml
          reporter: jest-junit
          fail-on-error: false
